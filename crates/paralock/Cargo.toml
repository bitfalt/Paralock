[package]
name = "paralock"
description = "Rust SDK of Paralock: embed a market maker or a taker for trustless ZEC to stablecoin swaps (htlc and private adaptor mode) in a Rust server. Zcash JSON-RPC and lightwalletd backends, durable swap stores, the maker HTTP API (server and client) and a price feed, wire-compatible with @paralock/sdk."
version.workspace = true
edition.workspace = true
# The `evm` feature builds on paralock-evm (alloy 2.x and tempo-alloy need Rust 1.95).
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/paralock"
authors.workspace = true
readme = "README.md"
keywords = ["zcash", "atomic-swap", "htlc", "stablecoin", "market-maker"]
categories = ["cryptography::cryptocurrencies", "network-programming", "asynchronous"]
include = ["src/**/*.rs", "proto/*.proto", "examples/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "tempo"]
## `HttpMakerApi`: talk to a maker over HTTP (any Paralock maker, TypeScript or Rust).
client = []
## `maker_router`: an axum router that serves a `Maker` with the protocol's HTTP API.
server = ["dep:axum", "dep:url"]
## `Lightwalletd`: a `ZcashNode` over a lightwalletd / Zaino gRPC server (no full node needed).
lightwalletd = ["dep:tonic", "dep:tonic-prost", "dep:prost"]
## `CoinGecko`: a cached USD/ZEC price feed with bounded staleness.
price-feed = []
## EVM clients from `paralock-evm` (alloy) for both escrows, and the `create_taker` / `create_maker` builders that
## connect to RPC URLs.
evm = ["dep:paralock-evm"]
## With `evm`: Tempo transactions that pay gas in a chosen TIP-20 fee token (`EvmChainOptions::fee_token`), through
## `tempo-alloy`. Without it Tempo still works with plain EIP-1559 transactions, and the dependency tree is much
## smaller (`default-features = false, features = ["evm", …]`).
tempo = ["paralock-evm?/tempo"]

[dependencies]
paralock-core = { path = "../paralock-core", version = "0.1.0" }
paralock-evm = { path = "../paralock-evm", version = "0.1.0", optional = true, default-features = false }
async-trait = "0.1.89"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }
axum = { version = "0.8.4", optional = true, default-features = false, features = ["tokio", "http1"] }
url = { version = "2.5.4", optional = true }
tonic = { version = "0.14.2", optional = true, default-features = false, features = [
    "channel",
    "codegen",
    "tls-aws-lc",
    "tls-native-roots",
    "tls-webpki-roots",
] }
tonic-prost = { version = "0.14.2", optional = true }
prost = { version = "0.14.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "test-util"] }
tower = { workspace = true, features = ["util"] }
sha2 = { workspace = true }
k256 = { workspace = true }
http-body-util = "0.1.3"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[[example]]
name = "devnet"
required-features = ["evm", "server", "client", "price-feed", "lightwalletd"]

[lints]
workspace = true
