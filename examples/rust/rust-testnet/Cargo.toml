[package]
name = "rust-testnet"
description = "A real Paralock swap on public testnets with the Rust SDK: Zcash testnet (TAZ) over lightwalletd to OUSD on Tempo Moderato, with an in-process maker."
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[dependencies]
paralock = { path = "../../../crates/paralock", features = ["evm", "lightwalletd", "price-feed"] }
paralock-evm = { path = "../../../crates/paralock-evm" }
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
