[package]
name = "rust-recovery"
description = "A small Paralock recovery daemon: opens a taker's durable store, resumes the swaps that can continue and refunds the ones past their refund height, with a dry run."
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[dependencies]
paralock = { path = "../../../crates/paralock", features = ["evm", "client", "price-feed"] }
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
