[package]
name = "rust-quickstart"
description = "The smallest end-to-end swap with the Paralock Rust SDK: a Rust taker sells ZEC for stablecoins on the local devnet against the TypeScript maker (htlc mode)."
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[dependencies]
paralock = { path = "../../../crates/paralock", features = ["evm", "client", "price-feed"] }
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
