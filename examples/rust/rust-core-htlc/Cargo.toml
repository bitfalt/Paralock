[package]
name = "rust-core-htlc"
description = "The Paralock protocol primitives a wallet developer uses, with paralock-core only: keys and secrets, HTLCs and their P2SH addresses, funding/claim/refund transactions, the composite lock checks, and an adaptor-signature round trip. Offline; --broadcast sends the transactions to the devnet regtest."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
paralock-core = { path = "../../../crates/paralock-core" }
# Only for --broadcast: the devnet's Zcash RPC and faucet.
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
rand_core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
