[package]
name = "rust-maker-server"
description = "A Paralock market maker embedded in your own axum application: the SDK's maker router under /paralock, your own health and metrics routes, production middleware and graceful shutdown. No Node process."
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[dependencies]
paralock = { path = "../../../crates/paralock", features = ["evm", "server", "price-feed"] }
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
axum = { version = "0.8.4", default-features = false, features = ["tokio", "http1", "json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { version = "0.6.6", default-features = false, features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
