[package]
name = "rust-pay"
description = "Pay an exact dollar amount to a third party from ZEC with the Paralock Rust SDK: exact-out quote, private (adaptor) mode, relayed claim, optional fresh recipient, and a receipt."
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[dependencies]
paralock = { path = "../../../crates/paralock", features = ["evm", "client", "price-feed"] }
devnet = { package = "paralock-examples-devnet", path = "../devnet" }
anyhow = "1.0.100"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
