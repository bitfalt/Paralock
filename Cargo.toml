[workspace]
resolver = "3"
members = ["crates/*", "examples/rust/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bitfalt/paralock"
homepage = "https://paralock.xyz"
documentation = "https://paralock.xyz/docs"
authors = ["bitfalt <https://github.com/bitfalt>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Shared dependency versions (paralock-core and future binding crates). Keep crypto crates on one RustCrypto
# generation (digest 0.10 / elliptic-curve 0.13 / rand_core 0.6) so the tree has a single copy of each.
[workspace.dependencies]
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
blake2b_simd = { version = "1.0.3", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc", "check"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std", "raw_value", "float_roundtrip"] }
thiserror = { version = "2.0.12", default-features = false }
zeroize = { version = "1.8.1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2.6.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
ryu = { version = "1.0.20", default-features = false }
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
# EVM layer (paralock-evm and the SDK on top of it). alloy 2.x is required by tempo-alloy (Tempo's official Alloy
# extensions); keep both on one release line.
alloy = { version = "2.5.0", default-features = false }
tempo-alloy = { version = "1.11.0", default-features = false }
tokio = { version = "1.47.0", default-features = false }
tower = { version = "0.5.2", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
