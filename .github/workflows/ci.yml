name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript packages, examples and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # anvil (with --network tempo) is used by the @paralock/evm tests.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:deps
      # Live regtest suites skip themselves when no local Zcash node is running.
      - run: pnpm --filter @paralock/zcash test
      - run: pnpm --filter @paralock/adaptor test
      - run: pnpm --filter @paralock/evm test
      - run: pnpm --filter @paralock/sdk test
      - run: pnpm --filter @paralock/lightwalletd test
      - run: pnpm --filter paralock test
      - name: Typecheck the examples
        # The TypeScript examples; examples/rust holds Cargo workspace members (built by the rust job).
        run: for d in examples/*/; do [ -f "$d/tsconfig.json" ] || continue; (cd "$d" && npx tsc --noEmit) || exit 1; done
      - name: Typecheck and build the web app
        working-directory: apps/web
        env:
          PARALOCK_BACKEND: mock
        run: npx tsc --noEmit && npx next build

  rust:
    name: Rust crates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # anvil (plain and --network tempo) for the integration tests; Node for the TypeScript interop tests.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Audit dependencies
        run: cargo install --locked cargo-audit && cargo audit

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
